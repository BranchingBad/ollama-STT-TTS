[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-voice-assistant"
version = "0.1.0"
description = "A hands-free Python voice assistant that runs 100% locally with Ollama."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0,<3.0",
    "ollama>=0.1.6,<1.0",
    "openwakeword>=0.6.0,<1.0",
    "webrtcvad>=2.0.10,<3.0",
    "faster-whisper>=1.0.0,<2.0",
    "sounddevice>=0.4.6,<1.0",
    "piper-tts>=1.2.0,<2.0",
    "psutil>=5.9,<8.0",
    "scipy>=1.10,<2.0",
    "requests>=2.28,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0,<9.0",
    "unittest-xml-reporting>=3.2,<4.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
ollama-voice-assistant = "voice_assistant.assistant:main"

[project.urls]
"Homepage" = "https://github.com/BranchingBad/ollama-STT-TTS"
"Bug Tracker" = "https://github.com/BranchingBad/ollama-STT-TTS/issues"
