[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-voice-assistant"
version = "0.1.0"
description = "A hands-free Python voice assistant that runs 100% locally with Ollama."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0,<3.0",
    "ollama>=0.1.6,<1.0",
    "openwakeword>=0.6.0,<1.0",
    "webrtcvad>=2.0.10,<3.0",
    "faster-whisper>=1.0.0,<2.0",
    "sounddevice>=0.4.6,<1.0",
    "piper-tts>=1.2.0,<2.0",
    "psutil>=5.9,<8.0",
    "scipy>=1.10,<2.0",
    "requests>=2.28,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0,<9.0",
    "unittest-xml-reporting>=3.2,<4.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
ollama-voice-assistant = "voice_assistant.assistant:main"

[project.urls]
"Homepage" = "https://github.com/BranchingBad/ollama-STT-TTS"
"Bug Tracker" = "https://github.com/BranchingBad/ollama-STT-TTS/issues"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
# Conservative ruleset: pycodestyle errors + pyflakes + import sorting.
# Bug-finding rules first; style nits later.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter, not blocker
    "E701",  # `if cond: stmt` one-liners — readable enough for short guards
    "E702",
    "B008",  # function call in default argument is fine for argparse types
]

[tool.ruff.lint.per-file-ignores]
# Tests stub native modules in sys.modules before importing the code under
# test, so module-level imports legitimately appear after statements.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
